<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Task Manager</title>
	<style>
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f3f5fa; color: #24283a; font: 16px/1.5 system-ui, sans-serif; }
		main { width: min(100%, 560px); padding: 32px; border: 1px solid #e4e7ef; border-radius: 16px; background: white; box-shadow: 0 12px 40px #20294b12; }
		h1 { margin: 0; font-size: 1.8rem; }
		.intro { margin: 5px 0 24px; color: #707789; }
		form { display: flex; gap: 10px; }
		#task-input { flex: 1; min-width: 0; padding: 12px 14px; border: 1px solid #d6dbe7; border-radius: 8px; font: inherit; }
		#task-input:focus { outline: 2px solid #7164e8; outline-offset: 1px; }
		button { padding: 11px 17px; border: 0; border-radius: 8px; background: #6558df; color: white; font: inherit; font-weight: 600; cursor: pointer; }
		button:hover { background: #5044c8; }
		.list-header { display: flex; justify-content: space-between; align-items: center; margin: 27px 0 8px; }
		h2 { margin: 0; font-size: 1rem; }
		#task-count { color: #707789; font-size: .9rem; }
		ul { list-style: none; padding: 0; margin: 0; }
		li { display: flex; align-items: center; gap: 12px; padding: 12px 2px; border-bottom: 1px solid #edf0f5; }
		li:last-child { border-bottom: 0; }
		li input { width: 18px; height: 18px; accent-color: #6558df; }
		li span { flex: 1; overflow-wrap: anywhere; }
		li.completed span { color: #9298a7; text-decoration: line-through; }
		.empty { justify-content: center; padding: 20px 0; color: #858b9a; text-align: center; }
		@media (max-width: 440px) { main { padding: 24px 20px; } form { flex-direction: column; } }
	</style>
</head>
<body>
	<main>
		<h1>My tasks</h1>
		<p class="intro">Add a task and keep track of what’s next.</p>
		<form id="task-form">
			<input id="task-input" type="text" placeholder="What needs to be done?" aria-label="New task" required>
			<button type="submit">Add task</button>
		</form>
		<section aria-labelledby="list-title">
			<div class="list-header">
				<h2 id="list-title">Task list</h2>
				<span id="task-count">0 tasks</span>
			</div>
			<ul id="task-list" aria-live="polite"></ul>
		</section>
	</main>
	<script>
		const form = document.querySelector('#task-form');
		const input = document.querySelector('#task-input');
		const list = document.querySelector('#task-list');
		const count = document.querySelector('#task-count');
		const tasks = [];

		function renderTasks() {
			list.replaceChildren();
			count.textContent = `${tasks.length} ${tasks.length === 1 ? 'task' : 'tasks'}`;

			if (tasks.length === 0) {
				const empty = document.createElement('li');
				empty.className = 'empty';
				empty.textContent = 'No tasks yet. Add one above to get started.';
				list.append(empty);
				return;
			}

			tasks.forEach((task) => {
				const item = document.createElement('li');
				if (task.completed) item.classList.add('completed');
				const checkbox = document.createElement('input');
				checkbox.type = 'checkbox';
				checkbox.checked = task.completed;
				checkbox.setAttribute('aria-label', `Mark ${task.title} as ${task.completed ? 'incomplete' : 'complete'}`);
				checkbox.addEventListener('change', () => {
					task.completed = checkbox.checked;
					renderTasks();
				});
				const title = document.createElement('span');
				title.textContent = task.title;
				item.append(checkbox, title);
				list.append(item);
			});
		}

		form.addEventListener('submit', (event) => {
			event.preventDefault();
			const title = input.value.trim();
			if (!title) return;
			tasks.push({ title, completed: false });
			input.value = '';
			input.focus();
			renderTasks();
		});

		renderTasks();
	</script>
</body>
</html>
